{% extends "base.html" %}

{% block title %}Iniciar sesión | Agencia de Vuelos{% endblock %}

{% block content %}
<section class="login-card">
    <div class="login-symbol"><i class="bi bi-airplane-engines-fill"></i></div>
    <p class="login-brand-name">Agencia de Vuelos</p>
    <h1>Bienvenido</h1>
    <p class="login-caption">Inicia sesión en tu cuenta</p>

    {% if error %}
    <div class="alert alert-danger py-2 small" role="alert">{{ error }}</div>
    {% endif %}

    <form method="post" action="{{ url_for('login') }}" class="d-grid gap-3">
        <div>
            <label class="form-label" for="correo">Correo</label>
            <input class="form-control" id="correo" name="correo" type="email" autocomplete="username" required autofocus>
        </div>
        <div>
            <label class="form-label" for="contrasena">Contraseña</label>
            <input class="form-control" id="contrasena" name="contrasena" type="password" autocomplete="current-password" required>
        </div>
        <button class="btn btn-primary w-100" type="submit"><i class="bi bi-box-arrow-in-right me-2"></i>Iniciar sesión</button>
    </form>
</section>
{% endblock %}
